name: Update security dependencies

on:
  push:
    branches:
      - security/update-dependencies
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Update vulnerable dependencies
        run: |
          cargo update -p quinn-proto --precise 0.11.15
          cargo update -p openssl --precise 0.10.80
          cargo update -p rustls-webpki --precise 0.103.13
          cargo update -p rand
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git diff --cached --quiet || git commit -m "fix(security): update vulnerable Rust dependencies"
          git push
