name: Update AWS-LC lockfile

on:
  push:
    branches:
      - security/update-aws-lc

permissions:
  contents: write

jobs:
  update-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Update AWS-LC dependencies
        run: cargo update -p aws-lc-rs --precise 1.16.2
      - name: Commit updated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git diff --cached --quiet || git commit -m 'fix(security): update AWS-LC dependencies'
          git push
